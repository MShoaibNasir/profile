<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Biodata PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  padding:20px;
}

button{
  display:block;
  margin:0 auto 20px;
  padding:10px 20px;
  background:#e84545;
  color:#fff;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

.card{
  max-width:900px;
  margin:auto;
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* HEADER */
.header{
  display:flex;
  background:#2b2e4a;
  color:#fff;
  padding:20px;
  align-items:center;
  gap:20px;
}

.header img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:3px solid #fff;
}

.header h1{
  margin:0;
}

/* BODY */
.body{
  padding:20px;
}

.section{
  margin-bottom:20px;
  padding:15px;
  background:#f7f7f7;
  border-radius:10px;
}

.section h2{
  margin:0 0 10px;
  color:#2b2e4a;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #ddd;
  font-size:14px;
}

.footer{
  text-align:center;
  padding:10px;
  background:#eee;
  font-size:12px;
}
</style>
</head>

<body>

<button onclick="downloadPDF()">Download PDF</button>

<div class="card" id="pdf">

  <div class="header">
    <img src=".//SHOAIB.png" crossorigin="anonymous">
    <div>
      <h1>Shoaib Nasir</h1>
      <p>Software Engineer | Karachi</p>
    </div>
  </div>

  <div class="body">

    <div class="section">
      <h2>Personal Info</h2>
      <div class="row"><span>Name</span><span>Muhammad Shoaib Nasir</span></div>
      <div class="row"><span>Father</span><span>Nasir Mehmod</span></div>
      <div class="row"><span>DOB</span><span>06-12-1998</span></div>
      <div class="row"><span>Religion</span><span>Islam</span></div>
    </div>

    <div class="section">
      <h2>Education</h2>
      <div class="row"><span>Degree</span><span>BSCS</span></div>
      <div class="row"><span>Institute</span><span>Virtual University</span></div>
    </div>

    <div class="section">
      <h2>Contact</h2>
      <div class="row"><span>Phone</span><span>0315-2762116</span></div>
      <div class="row"><span>Email</span><span>shoaibnasir315@gmail.com</span></div>
    </div>

  </div>

  <div class="footer">
    Biodata Document
  </div>

</div>

<script>
function downloadPDF(){
  const element = document.getElementById("pdf");

  html2pdf().set({
    margin: 0,
    filename: 'biodata.pdf',
    image: { type: 'jpeg', quality: 1 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save();
}
</script>

</body>
</html>
